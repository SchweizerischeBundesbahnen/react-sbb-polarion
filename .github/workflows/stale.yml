---
# Closes issues and pull requests that have gone quiet, so the open list reflects what is actually
# being worked on. Ninety days of silence, then fourteen days' notice before closing.
name: Mark stale issues and pull requests

on:
  schedule:
    - cron: 30 1 * * *
  workflow_dispatch:

permissions: {}

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93  # v11.0.0
        with:
          stale-issue-message: >
            This issue has been automatically marked as stale because it has not had recent activity.
            It will be closed in 14 days if no further activity occurs. Thank you for your
            contribution.
          stale-pr-message: >
            This pull request has been automatically marked as stale because it has not had recent
            activity. It will be closed in 14 days if no further activity occurs. Thank you for your
            contribution.
          days-before-stale: 90
          days-before-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: pinned,keep
          # `autorelease: pending` is release-please's own pull request: it is regenerated rather than
          # tended, so it must never be closed from under the release process.
          exempt-pr-labels: 'pinned,keep,autorelease: pending'
