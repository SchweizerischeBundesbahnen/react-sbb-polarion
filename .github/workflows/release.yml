name: Release

# Manually triggered release: bumps the version, commits + tags on main, and publishes a GitHub
# release with the npm tarball attached as an asset. Consumers install the tarball straight from
# the release asset URL - no registry, no auth token (the repo is public).
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'npm version argument: patch | minor | major | explicit version (e.g. 1.2.3)'
        required: true
        default: patch

permissions:
  contents: write
  # npm provenance: lets `npm publish --provenance` attest, from a signed OIDC token, that this
  # tarball was built by this workflow from this commit.
  id-token: write

jobs:
  test:
    # Same pinned Playwright image as ci.yml - see the comment there.
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.62.0-noble
    # This IS the reference environment for the committed screenshots, so the visual suites must
    # assert here (they skip themselves anywhere else - see vitest.config.ts).
    env:
      PIXEL_REFERENCES: '1'
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm test

  release:
    needs: test
    # Releases are cut from main only.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          # Required for `npm publish` to resolve the auth token below.
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - name: Bump version, tag and push
        env:
          VERSION_ARG: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version "$VERSION_ARG" -m "chore: bump version to %s"
          git push --follow-tags
      # The registry is the distribution channel: consumers depend on a semver range, which npm 12
      # requires (it refuses "remote" tarball-URL dependencies outright) and which renovate can track.
      - name: Publish to npmjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
      # The GitHub release asset stays: it is what the previously released versions are pinned to, and
      # it keeps the release page self-contained.
      - name: Pack and create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm pack
          VERSION="$(node -p "require('./package.json').version")"
          # npm pack derives the filename from the scoped package name publish the asset without the scope prefix.
          mv ./*.tgz "react-sbb-polarion-${VERSION}.tgz"
          gh release create "v${VERSION}" ./*.tgz --title "v${VERSION}" --generate-notes
