name: Release

# Manually triggered release: bumps the version, commits + tags on main, and publishes a GitHub
# release with the npm tarball attached as an asset. Consumers install the tarball straight from
# the release asset URL - no registry, no auth token (the repo is public).
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'npm version argument: patch | minor | major | explicit version (e.g. 1.2.3)'
        required: true
        default: patch

permissions:
  contents: write
  # npm provenance: lets `npm publish --provenance` attest, from a signed OIDC token, that this
  # tarball was built by this workflow from this commit.
  id-token: write

jobs:
  test:
    # Same pinned Playwright image as ci.yml - see the comment there.
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.62.0-noble
    # This IS the reference environment for the committed screenshots, so the visual suites must
    # assert here (they skip themselves anywhere else - see vitest.config.ts).
    env:
      PIXEL_REFERENCES: '1'
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm test

  release:
    needs: test
    # Releases are cut from main only.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          # Points npm at npmjs and writes the .npmrc that the OIDC exchange below needs.
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      # Bump the manifest only - no commit, no tag. Everything that outlives the run happens after the
      # publish succeeds: a failed publish used to leave a pushed commit and tag behind for a version
      # that exists nowhere, and it did, twice.
      - name: Bump the version
        env:
          VERSION_ARG: ${{ inputs.version }}
        run: |
          npm version "$VERSION_ARG" --no-git-tag-version
          echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
          if git ls-remote --exit-code --tags origin "refs/tags/v$(node -p "require('./package.json').version")" >/dev/null 2>&1; then
            echo "::error::Tag v$(node -p "require('./package.json').version") already exists - pick another version input."
            exit 1
          fi
      # The registry is the distribution channel: consumers depend on a semver range, which npm 12
      # requires (it refuses "remote" tarball-URL dependencies outright) and which renovate can track.
      #
      # No token: npmjs is configured to trust this repository's release workflow, so npm authenticates
      # with the same OIDC identity that signs the provenance statement. A granular token cannot be used
      # here anyway - the account requires 2FA for writes, so publishing with one fails on EOTP, and npm
      # is retiring 2FA-bypassing tokens for direct publishing.
      - name: Publish to npmjs
        run: npm publish --provenance --access public
      # Only now that the package is on the registry: record the version in git and publish the release.
      - name: Commit, tag and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: bump version to ${VERSION}"
          git tag -a "v${VERSION}" -m "v${VERSION}"
          # The run may have started before someone else pushed; rebase rather than fail on a stale ref.
          git pull --rebase origin main
          git push --follow-tags
      # The GitHub release asset stays: it is what the previously released versions are pinned to, and
      # it keeps the release page self-contained.
      - name: Pack and create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm pack
          # npm pack derives the filename from the scoped package name publish the asset without the scope prefix.
          mv ./*.tgz "react-sbb-polarion-${VERSION}.tgz"
          gh release create "v${VERSION}" ./*.tgz --title "v${VERSION}" --generate-notes
