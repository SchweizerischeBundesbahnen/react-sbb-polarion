name: CI

# `ci` is a required status check on main, so it has to report on the pull request itself: a branch
# push produces a check run only in the repository that owns the branch, which would leave a fork's PR
# permanently unmergeable. Hence the pull_request trigger. `push` is narrowed to main so a same-repo
# branch does not build twice for the same commit (once for the branch, once for its PR).
on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR makes the run in flight pointless; main is left alone so release history is not
# cancelled halfway.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    # Pinned to the installed Playwright version (see package-lock.json) so the visual-test
    # screenshots match the references generated via `npm run test:update:docker`. Bump this tag
    # together with any Playwright bump (same rule as scripts/docker-test.mjs).
    container: mcr.microsoft.com/playwright:v1.62.0-noble
    # This IS the reference environment for the committed screenshots, so the visual suites must
    # assert here (they skip themselves anywhere else - see vitest.config.ts).
    env:
      PIXEL_REFERENCES: '1'
    steps:
      - uses: actions/checkout@v7
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build

      # The full suite WITH coverage, not a bare `npm test`: the thresholds in vitest.config.ts are only
      # applied when --coverage is passed, so without this the gate would live in the pre-commit hook
      # alone and a push that bypassed it would go green.
      - run: npm run test:coverage:full

      # Reporting only - the pass/fail decision already happened in the step above. `!cancelled()` so the
      # report still lands when the suite went red, which is when the PR comment is worth the most, and
      # fail_ci_if_error stays off so a Codecov outage cannot fail an otherwise good build.
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/lcov.info
          disable_search: true
          fail_ci_if_error: false
          # A public repo can upload without a token, but unauthenticated uploads are rate-limited and
          # drop often enough to make the badge stale. The action falls back to tokenless when the
          # secret is absent, so this is safe to leave in place before CODECOV_TOKEN is configured.
          token: ${{ secrets.CODECOV_TOKEN }}
