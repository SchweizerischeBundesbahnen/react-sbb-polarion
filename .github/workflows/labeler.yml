---
# Labels a pull request from the paths it touches, so the vendored and visual-reference cases are
# visible in the list before anyone opens the diff. Configuration: .github/labeler.yml
name: Label pull requests

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write  # apply the labels
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13  # v7.0.0
        with:
          configuration-path: .github/labeler.yml
