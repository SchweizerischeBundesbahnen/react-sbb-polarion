# SonarQube Cloud analysis. Run from CI (see the `sonar` job in .github/workflows/ci.yml) rather than
# through Automatic Analysis: Automatic Analysis never sees a coverage report, so it would report this
# project as 0% covered. The two are mutually exclusive - Automatic Analysis has to stay OFF in the
# project's settings, or it rejects the CI-based analysis.

sonar.projectKey=SchweizerischeBundesbahnen_react-sbb-polarion
sonar.organization=schweizerischebundesbahnen

sonar.sources=src
sonar.tests=test

# Produced by `npm run test:coverage:full`. Sonar only reports these numbers; the gate that fails a
# build is `thresholds` in vitest.config.ts, enforced by the CI job and by the pre-commit hook.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# src/generic/** is a vendored copy of ch.sbb.polarion.extension.generic, kept in sync until the other
# extensions migrate onto RSP and then deleted. It is deliberately excluded from Prettier and ESLint for
# the same reason, and its issues are not actionable here - fixing them would mean hand-editing a file
# that must only ever be re-copied from generic.
sonar.exclusions=src/generic/**

# Mirrors coverage.exclude in vitest.config.ts, so Sonar's percentage matches the gate rather than
# quietly diverging from it: type-only files and the barrel have no executable code to cover.
sonar.coverage.exclusions=src/index.ts,src/types.ts,src/**/*.d.ts,src/**/*.css

# Two rules the Modal breaks on purpose. Each is stated here as it is in the code, so the reason travels
# with the exception:
# - S6747 (no-unknown-property): `closedby` is the light-dismiss attribute of <dialog>, which React 19
#   renders and @types/react types; the rule's list of attributes predates it.
# - S6845 (no-noninteractive-tabindex): the content <section> is the dialog's only scroller and has to
#   be in the Tab order, so the keyboard can scroll it. eslint.config.js allows tabIndex on a section for
#   the same reason.
sonar.issue.ignore.multicriteria=closedby,scroller
sonar.issue.ignore.multicriteria.closedby.ruleKey=typescript:S6747
sonar.issue.ignore.multicriteria.closedby.resourceKey=src/components/Modal.tsx
sonar.issue.ignore.multicriteria.scroller.ruleKey=typescript:S6845
sonar.issue.ignore.multicriteria.scroller.resourceKey=src/components/Modal.tsx
